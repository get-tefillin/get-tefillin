<script>/* carries saved app state over from the old address (tefillin-now) once */(function(){var h=location.hash;if(h.indexOf("#tnmig=")!==0)return;try{if(/^https:\/\/tefillin-now\.sites\.tab\.bot\//.test(document.referrer)||document.referrer===""){var d=JSON.parse(decodeURIComponent(h.slice(7)));for(var k in d){if(k.indexOf("tn_")===0&&typeof d[k]==="string"&&localStorage.getItem(k)==null)localStorage.setItem(k,d[k])}}}catch(e){}try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}})();</script>
